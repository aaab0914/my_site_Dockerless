{% extends "blog/base.html" %}
{% load static %}
{% block title %}
    Register
{% endblock title %}
{% block content %}
    <link rel="stylesheet" href="{% static 'users/css/users.css' %}">
    <div class="users-form-container">
        <h2 class="users-form-title">Register</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button class="users-form-button" type="submit">Sign Up</button>
        </form>
    </div>
{% endblock content %}
